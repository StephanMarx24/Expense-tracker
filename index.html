<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE7D8;
    --paper-raised:#F5F0E4;
    --ink:#232E3B;
    --ink-soft:#5C6673;
    --line:#C9BEA3;
    --brass:#A6791F;
    --rust:#AE4530;
    --sage:#57755A;
    --teal:#3E6A68;
    --plum:#6A4C68;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{
    max-width:520px;
    margin:0 auto;
    padding:22px 18px 60px;
  }

  /* ---- Header ---- */
  .header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .stamp{
    width:34px;height:34px;border-radius:50%;
    border:1.5px dashed var(--brass);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces', serif; font-weight:600; font-size:15px;
    color:var(--brass);
    transform:rotate(-6deg);
    flex-shrink:0;
  }
  .brand-text{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.05rem;
    letter-spacing:0.02em;
  }
  .month-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.08em;
    text-align:right;
    padding-top:8px;
  }

  /* ---- Budget line ---- */
  .budget-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:0.85rem;
    color:var(--ink-soft);
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
    margin-bottom:20px;
  }
  .budget-row span.label{font-family:'IBM Plex Mono', monospace; letter-spacing:0.03em;}
  .budget-edit-btn{
    background:none;border:none;color:var(--brass);
    font-family:'IBM Plex Mono', monospace; font-size:0.75rem;
    cursor:pointer; text-decoration:underline; padding:0;
  }
  .budget-input-row{display:flex; gap:8px; align-items:center;}
  .budget-input-row input{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
    border:1px solid var(--line);
    background:var(--paper-raised);
    border-radius:4px;
    padding:4px 8px;
    width:100px;
    color:var(--ink);
  }
  .budget-input-row button{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.78rem;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:4px;
    padding:5px 12px;
    cursor:pointer;
  }
  .cycle-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:0.85rem;
    color:var(--ink-soft);
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
    margin-bottom:20px;
  }
  .cycle-row span.label{font-family:'IBM Plex Mono', monospace; letter-spacing:0.03em;}
  .cycle-input-row{display:flex; gap:8px; align-items:center;}
  .cycle-input-row select{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
    border:1px solid var(--line);
    background:var(--paper-raised);
    border-radius:4px;
    padding:4px 8px;
    color:var(--ink);
  }
  .cycle-input-row button{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.78rem;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:4px;
    padding:5px 12px;
    cursor:pointer;
  }

  /* ---- Hero remaining figure ---- */
  .hero{margin-bottom:22px;}
  .hero .amount{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(2.1rem, 9vw, 2.7rem);
    line-height:1.05;
  }
  .hero .amount.over{color:var(--rust);}
  .hero .sub{
    font-size:0.85rem;
    color:var(--ink-soft);
    margin-top:4px;
  }

  /* ---- Ruler / pace comparison (signature element) ---- */
  .ruler-block{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:8px;
    padding:16px 16px 12px;
    margin-bottom:20px;
  }
  .ruler-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    margin-bottom:12px;
  }
  .track-row{margin-bottom:12px;}
  .track-row:last-child{margin-bottom:2px;}
  .track-label{
    display:flex; justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.68rem;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .track{
    position:relative;
    height:8px;
    background:var(--line);
    border-radius:4px;
    overflow:visible;
  }
  .track-fill{
    position:absolute; left:0; top:0; bottom:0;
    border-radius:4px;
    background:var(--ink);
  }
  .track-fill.money{background:var(--sage);}
  .track-fill.money.over{background:var(--rust);}
  .track-marker{
    position:absolute; top:50%; width:10px; height:10px;
    background:var(--paper-raised);
    border:2px solid var(--ink);
    border-radius:50%;
    transform:translate(-50%,-50%);
  }

  /* ---- Insight card ---- */
  .insight{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--ink);
    color:var(--paper);
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:24px;
  }
  .insight .figure{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.5rem;
    white-space:nowrap;
  }
  .insight .text{
    font-size:0.78rem;
    line-height:1.35;
    color:#D8D2C2;
  }
  .insight .text b{color:var(--paper);}

  /* ---- Quick add form ---- */
  .section-title{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--ink-soft);
    margin:0 0 10px;
  }
  form.add-form{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:26px;
  }
  .amt-field{
    position:relative;
    flex:1 1 90px;
  }
  .amt-field span{
    position:absolute; left:10px; top:50%; transform:translateY(-50%);
    color:var(--ink-soft); font-family:'IBM Plex Mono', monospace; font-size:0.85rem;
  }
  .amt-field input{padding-left:20px;}
  .add-form input, .add-form select{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.85rem;
    border:1px solid var(--line);
    background:var(--paper-raised);
    border-radius:6px;
    padding:9px 10px;
    color:var(--ink);
  }
  .add-form input[type=number]{width:100%;}
  .add-form select{flex:1 1 100px;}
  .add-form input[name=note]{flex:2 1 130px;}
  .add-form input[type=date]{flex:1 1 130px;}
  .add-form button{
    flex:1 1 100%;
    background:var(--brass);
    color:var(--paper);
    border:none;
    border-radius:6px;
    padding:10px;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:0.85rem;
    cursor:pointer;
    letter-spacing:0.02em;
  }
  .add-form button:active{opacity:0.85;}

  /* ---- Transactions list, dotted-leader ledger rows ---- */
  .tx-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:0.85rem;
  }
  .tx-cat-dot{
    width:8px;height:8px;border-radius:50%;
    flex-shrink:0;
    margin-bottom:2px;
  }
  .tx-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    color:var(--ink-soft);
    flex-shrink:0;
    width:44px;
  }
  .tx-desc{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    position:relative;
  }
  .tx-desc .leader{
    display:inline-block;
    overflow:hidden;
    white-space:nowrap;
    letter-spacing:2px;
    color:var(--line);
    width:100%;
  }
  .tx-name{color:var(--ink);}
  .tx-amt{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
    flex-shrink:0;
  }
  .tx-del{
    background:none;border:none;color:var(--ink-soft);
    cursor:pointer; font-size:0.9rem; padding:0 0 0 4px; line-height:1;
    flex-shrink:0;
  }
  .empty-state{
    color:var(--ink-soft);
    font-size:0.85rem;
    padding:18px 0;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:8px;
  }
  .backup-row{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
  .backup-btn{flex:1 1 120px;background:none;border:1px solid var(--line);color:var(--ink-soft);border-radius:6px;padding:8px 10px;font-family:'IBM Plex Sans',sans-serif;font-size:.78rem;cursor:pointer;}
  .backup-btn:hover{background:var(--paper-raised);color:var(--ink);}
  .dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
  .stat-card{background:var(--paper-raised);border:1px solid var(--line);border-radius:8px;padding:12px 14px;}
  .stat-label{font-family:'IBM Plex Mono',monospace;font-size:.65rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);}
  .stat-value{font-family:'Fraunces',serif;font-size:1.35rem;font-weight:600;margin-top:4px;}
  .category-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:.78rem;}
  .category-name{width:72px;flex-shrink:0;}
  .category-bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;flex:1;}
  .category-fill{height:100%;border-radius:4px;}
  .category-amount{font-family:'IBM Plex Mono',monospace;width:72px;text-align:right;font-size:.72rem;}
  .tx-edit{background:none;border:none;color:var(--brass);cursor:pointer;font-size:.72rem;padding:0 2px;flex-shrink:0;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(35,46,59,.35);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10;}
  .modal{width:min(100%,420px);background:var(--paper-raised);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:0 12px 35px rgba(0,0,0,.18);}
  .modal h3{font-family:'Fraunces',serif;margin:0 0 14px;font-size:1.2rem;}
  .modal label{display:block;font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--ink-soft);text-transform:uppercase;margin:10px 0 5px;}
  .modal input,.modal select{width:100%;font-family:'IBM Plex Sans',sans-serif;font-size:.85rem;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:9px;color:var(--ink);}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-actions button{flex:1;border:0;border-radius:6px;padding:9px;cursor:pointer;}
  .modal-save{background:var(--brass);color:var(--paper);}.modal-cancel{background:var(--line);color:var(--ink);}
  .loading{
    text-align:center;
    color:var(--ink-soft);
    padding:60px 0;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.8rem;
  }
</style>
</head>
<body>
<div class="page" id="app">
  <div class="loading">Opening the ledger…</div>
</div>

<script>
  const CATEGORIES = [
  {id:'food', label:'Food', color:'var(--rust)'},
  {id:'transport', label:'Transport', color:'var(--teal)'},
  {id:'shopping', label:'Shopping', color:'var(--plum)'},
  {id:'bills', label:'Bills', color:'var(--ink-soft)'},
  {id:'fun', label:'Fun', color:'var(--brass)'},
  {id:'other', label:'Other', color:'var(--sage)'}
];
const STORE_KEY = 'ledger-data';

let state = { budget: null, transactions: [], cycleStartDay: 1, recurring: [] };
let editingBudget = false;
let editingCycle = false;

function catInfo(id){ return CATEGORIES.find(c=>c.id===id) || CATEGORIES[CATEGORIES.length-1]; }
function fmt(n){ return 'R' + n.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
function dateOnly(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function shortDate(d){ return d.toLocaleDateString(undefined,{month:'short', day:'numeric'}); }
function ordinal(n){
  const s = ['th','st','nd','rd'], v = n%100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

function getCycleBounds(refDate, startDay){
  const ref = dateOnly(refDate);
  let cycleMonth = ref.getMonth(), cycleYear = ref.getFullYear();
  if(ref.getDate() < startDay){
    cycleMonth -= 1;
    if(cycleMonth < 0){ cycleMonth = 11; cycleYear -= 1; }
  }
  const daysInStartMonth = new Date(cycleYear, cycleMonth+1, 0).getDate();
  const clampedStart = Math.min(startDay, daysInStartMonth);
  const start = new Date(cycleYear, cycleMonth, clampedStart);
  const end = new Date(start);
  end.setMonth(end.getMonth()+1);
  end.setDate(end.getDate()-1);
  return { start, end };
}

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      state = Object.assign({budget:null, transactions:[], cycleStartDay:1, recurring:[]}, JSON.parse(raw));
    }
  }catch(e){
    console.error('Could not load data', e);
  }
  render();
}

function saveData(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('Could not save data', e);
  }
}

function downloadBackup(){
  const payload={app:'Ledger',version:2,exportedAt:new Date().toISOString(),data:state};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); 
  const a=document.createElement('a');
  a.href=url; 
  a.download='ledger-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); 
  a.click(); 
  a.remove(); 
  URL.revokeObjectURL(url);
}

function importBackup(file){
  if(!file) return; 
  const reader=new FileReader();
  reader.onload = e => {
    try{
      const parsed=JSON.parse(e.target.result);
      const imported=parsed.data||parsed;
      if(!imported||!Array.isArray(imported.transactions)) throw new Error('Invalid backup');
      if(!confirm('Import this backup? Your current Ledger data will be replaced.')) return;
      state=Object.assign({budget:null,transactions:[],cycleStartDay:1,recurring:[]},imported);
      saveData();
      render();
      alert('Backup restored successfully.');
    }catch(err){
      alert('Could not restore this backup. Please choose a valid Ledger JSON file.');
    }
  }; 
  reader.readAsText(file);
}

function addRecurring(){
  const name=prompt('Recurring expense name:'); 
  if(!name||!name.trim()) return;
  const amount=parseFloat(prompt('Monthly amount in Rand:')); 
  if(isNaN(amount)||amount<=0) return;
  const category=prompt('Category (food, transport, shopping, bills, fun, other):','bills')||'bills';
  state.recurring=state.recurring||[]; 
  state.recurring.push({
    id:Date.now().toString(36),
    name:name.trim(),
    amount,
    category:CATEGORIES.some(c=>c.id===category)?category:'bills'
  });
  saveData();
  render();
}

function removeRecurring(id){
  state.recurring=(state.recurring||[]).filter(r=>r.id!==id);
  saveData();
  render();
}

function currentMonthTransactions(bounds){
  return state.transactions.filter(t=>{
    const d = dateOnly(new Date(t.date));
    return d >= bounds.start && d <= bounds.end;
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function editTransaction(id){
  const t=state.transactions.find(x=>x.id===id); 
  if(!t) return; 
  const d=new Date(t.date);
  const dateValue=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  
  const b=document.createElement('div'); 
  b.className='modal-backdrop'; 
  b.innerHTML=`
    <div class="modal">
      <h3>Edit transaction</h3>
      <label>Amount</label>
      <input id="editAmount" type="number" min="0.01" step="0.01" value="${t.amount}">
      <label>Category</label>
      <select id="editCategory">
        ${CATEGORIES.map(c=>`<option value="${c.id}" ${c.id===t.category?'selected':''}>${c.label}</option>`).join('')}
      </select>
      <label>Note</label>
      <input id="editNote" type="text" maxlength="40" value="${escapeHtml(t.note||'')}">
      <label>Date</label>
      <input id="editDate" type="date" value="${dateValue}">
      <div class="modal-actions">
        <button class="modal-cancel">Cancel</button>
        <button class="modal-save">Save changes</button>
      </div>
    </div>`;
  
  document.body.appendChild(b); 
  b.querySelector('.modal-cancel').onclick=()=>b.remove();
  b.querySelector('.modal-save').onclick=()=>{
    const amount=parseFloat(document.getElementById('editAmount').value);
    const dateStr=document.getElementById('editDate').value;
    if(isNaN(amount)||amount<=0||!dateStr) return;
    
    t.amount=amount;
    t.category=document.getElementById('editCategory').value;
    t.note=document.getElementById('editNote').value;
    
    const [y, m, day] = dateStr.split('-').map(Number);
    t.date = new Date(y, m - 1, day, 12, 0, 0).toISOString();
    
    b.remove();
    saveData();
    render();
  };
}

function render(){
  const app = document.getElementById('app');
  const now = new Date();
  const bounds = getCycleBounds(now, state.cycleStartDay || 1);
  const monthLabel = `${shortDate(bounds.start)} – ${shortDate(bounds.end)}`.toUpperCase();
  const daysInMonth = Math.round((bounds.end - bounds.start)/86400000) + 1;
  const today = Math.round((dateOnly(now) - bounds.start)/86400000) + 1;
  const monthTx = currentMonthTransactions(bounds).sort((a,b)=> new Date(b.date)-new Date(a.date));
  const spent = monthTx.reduce((s,t)=> s + t.amount, 0);
  const todayTx = monthTx.filter(t => {
    const d = dateOnly(new Date(t.date));
    return d.getTime() === dateOnly(now).getTime();
  });
  const spentToday = todayTx.reduce((s,t)=> s + t.amount, 0);
  const budget = state.budget;
  const recurringTotal = (state.recurring||[]).reduce((s,r)=>s+Number(r.amount||0),0);
  const remaining = budget!=null ? budget - spent : null;

  let html = '';

  // Header
  html += `
    <div class="header">
      <div class="brand">
        <div class="stamp">R</div>
        <div class="brand-text">Ledger</div>
      </div>
      <div>
        <div class="month-label">${monthLabel}</div>
        <div class="date-label">TODAY · ${now.toLocaleDateString(undefined,{day:'numeric', month:'short', year:'numeric'})}</div>
      </div>
    </div>`;

  html += `<div class="backup-row"><button class="backup-btn" id="exportBtn">Export JSON backup</button><button class="backup-btn" id="importBtn">Restore JSON backup</button><input type="file" id="importFile" accept=".json,application/json" style="display:none"></div>`;

  // Budget row
  if(editingBudget || budget==null){
    html += `
      <div class="budget-row">
        <span class="label">MONTHLY BUDGET</span>
        <div class="budget-input-row">
          <input type="number" id="budgetInput" placeholder="e.g. 24000" min="0" step="1" value="${budget!=null?budget:''}">
          <button id="budgetSaveBtn">Set</button>
        </div>
      </div>`;
  } else {
    html += `
      <div class="budget-row">
        <span class="label">MONTHLY BUDGET · ${fmt(budget)}</span>
        <button class="budget-edit-btn" id="budgetEditBtn">edit</button>
      </div>`;
  }

  // Cycle start row
  if(editingCycle){
    html += `
      <div class="cycle-row">
        <span class="label">CYCLE STARTS ON</span>
        <div class="cycle-input-row">
          <select id="cycleInput">
            ${Array.from({length:28},(_,i)=>i+1).map(n=>`<option value="${n}" ${n===(state.cycleStartDay||1)?'selected':''}>${n===1?'1st (calendar month)':ordinal(n)}</option>`).join('')}
          </select>
          <button id="cycleSaveBtn">Set</button>
        </div>
      </div>`;
  } else {
    const cd = state.cycleStartDay || 1;
    html += `
      <div class="cycle-row">
        <span class="label">${cd===1? 'TRACKING · CALENDAR MONTH' : 'TRACKING FROM DAY '+cd+' EACH MONTH'}</span>
        <button class="budget-edit-btn" id="cycleEditBtn">${cd===1? 'track from pay day':'edit'}</button>
      </div>`;
  }

  if(budget!=null){
    const over = remaining < 0;
    const daysRemaining = Math.max(1, daysInMonth - today + 1);
    const suggestedDaily = remaining > 0 ? remaining / daysRemaining : 0;
    const leftToday = suggestedDaily - spentToday;
    const leftTodayOver = leftToday < 0;

    html += `
      <div class="hero">
        <div class="amount ${leftTodayOver?'over':''}">${leftTodayOver ? fmt(Math.abs(leftToday))+' over' : fmt(leftToday)}</div>
        <div class="sub">${leftTodayOver ? 'over today’s suggested allowance' : 'left to spend today'} · ${fmt(remaining)} remaining in total</div>
      </div>`;

    // Pace comparison
    const timePct = Math.min(100, (today/daysInMonth)*100);
    const moneyPct = Math.min(100, (spent/budget)*100);
    const moneyOver = spent > budget;
    html += `
      <div class="ruler-block">
        <div class="ruler-title">Pace this month</div>
        <div class="track-row">
          <div class="track-label"><span>${shortDate(bounds.start)}</span><span>${shortDate(bounds.end)}</span></div>
          <div class="track">
            <div class="track-fill" style="width:${timePct}%"></div>
            <div class="track-marker" style="left:${timePct}%"></div>
          </div>
        </div>
        <div class="track-row">
          <div class="track-label"><span>R0</span><span>${fmt(budget)}</span></div>
          <div class="track">
            <div class="track-fill money ${moneyOver?'over':''}" style="width:${moneyPct}%"></div>
          </div>
        </div>
      </div>`;

    // Insight card
    const idealSpentByNow = budget * (today/daysInMonth);
    const paceDiff = idealSpentByNow - spent;

    let insightText;
    let figure;
    if(remaining <= 0){
      figure = fmt(0);
      insightText = `You've used up this month's budget. <b>${fmt(Math.abs(remaining))}</b> over, with ${daysRemaining} day${daysRemaining===1?'':'s'} left. You've spent <b>${fmt(spentToday)}</b> today.`;
    } else {
      figure = fmt(suggestedDaily);
      const paceMsg = paceDiff >= 0
        ? `You're <b>${fmt(Math.abs(paceDiff))} under</b> pace for today.`
        : `You're <b>${fmt(Math.abs(paceDiff))} over</b> pace for today.`;
      insightText = `Suggested max spend per day for the rest of the month, to stay on budget. ${paceMsg} You've spent <b>${fmt(spentToday)}</b> today.`;
    }
    html += `
      <div class="insight">
        <div class="figure">${figure}${remaining>0?'<span style="font-size:0.9rem;">/day</span>':''}</div>
        <div class="text">${insightText}</div>
      </div>`;
  } else {
    html += `<div class="empty-state" style="margin-bottom:24px;">Set a monthly budget above to see your remaining balance and daily spend suggestion.</div>`;
  }

  if(budget!=null){
    const catTotals=CATEGORIES.map(c=>({...c,total:monthTx.filter(t=>t.category===c.id).reduce((s,t)=>s+t.amount,0)}));
    const maxCat=Math.max(1,...catTotals.map(c=>c.total));
    const avgDaily=spent/Math.max(1,today);
    const daysRemaining = Math.max(1, daysInMonth - today + 1);
    const suggestedDaily = remaining > 0 ? remaining / daysRemaining : 0;

    html += `<div class="section-title">At a glance</div><div class="dashboard-grid">
      <div class="stat-card"><div class="stat-label">Spent today</div><div class="stat-value">${fmt(spentToday)}</div></div>
      <div class="stat-card"><div class="stat-label">Average per day</div><div class="stat-value">${fmt(avgDaily)}</div></div>
      <div class="stat-card"><div class="stat-label">Recurring / cycle</div><div class="stat-value">${fmt(recurringTotal)}</div></div>
      <div class="stat-card"><div class="stat-label">Transactions</div><div class="stat-value">${monthTx.length}</div></div></div>
      <div class="section-title">Spending by category</div><div style="margin-bottom:24px;">${catTotals.map(c=>`<div class="category-row"><span class="category-name">${c.label}</span><div class="category-bar"><div class="category-fill" style="width:${Math.min(100,c.total/maxCat*100)}%;background:${c.color}"></div></div><span class="category-amount">${fmt(c.total)}</span></div>`).join('')}</div>
      <div class="section-title">Daily spending</div><div style="margin-bottom:24px;">${Array.from({length:today},(_,i)=>{const day=new Date(bounds.start);day.setDate(day.getDate()+i);const total=monthTx.filter(t=>dateOnly(new Date(t.date)).getTime()===dateOnly(day).getTime()).reduce((s,t)=>s+t.amount,0);return `<div class="category-row"><span class="category-name">${shortDate(day)}</span><div class="category-bar"><div class="category-fill" style="width:${Math.min(100,total/Math.max(1,suggestedDaily)*100)}%;background:var(--ink)"></div></div><span class="category-amount">${fmt(total)}</span></div>`;}).join('')}</div>
      <div class="section-title">Recurring expenses</div><div style="margin-bottom:24px;">${(state.recurring||[]).length?(state.recurring||[]).map(r=>`<div class="tx-row"><span class="tx-cat-dot" style="background:${catInfo(r.category).color}"></span><span class="tx-desc"><span class="tx-name">${escapeHtml(r.name)}</span></span><span class="tx-amt">${fmt(r.amount)}</span><button class="tx-del recurring-del" data-id="${r.id}" title="Remove">✕</button></div>`).join(''):'<div class="empty-state">No recurring expenses added.</div>'}<button class="backup-btn" id="addRecurringBtn" style="margin-top:10px;">+ Add recurring expense</button></div>`;
  }

  // Quick add form
  html += `
    <div class="section-title">Log a transaction</div>
    <form class="add-form" id="addForm">
      <div class="amt-field"><span>R</span><input type="number" name="amount" placeholder="0.00" step="0.01" min="0" required></div>
      <select name="category">
        ${CATEGORIES.map(c=>`<option value="${c.id}">${c.label}</option>`).join('')}
      </select>
      <input type="text" name="note" placeholder="Note (optional)" maxlength="40">
      <input type="date" name="date" value="${new Date().toISOString().slice(0,10)}">
      <button type="submit">Add transaction</button>
    </form>`;

  // Transaction list
  html += `<div class="section-title">This month's transactions</div>`;
  if(monthTx.length===0){
    html += `<div class="empty-state">No transactions yet — log your first one above.</div>`;
  } else {
    html += monthTx.map(t=>{
      const c = catInfo(t.category);
      const d = new Date(t.date);
      const dateStr = d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
      const name = (t.note && t.note.trim()) ? t.note.trim() : c.label;
      return `
        <div class="tx-row">
          <span class="tx-cat-dot" style="background:${c.color}"></span>
          <span class="tx-date">${dateStr}</span>
          <span class="tx-desc"><span class="leader">${escapeHtml(name)} ${'.'.repeat(60)}</span></span>
          <span class="tx-amt">${fmt(t.amount)}</span>
          <button class="tx-edit" data-id="${t.id}" title="Edit">edit</button>
          <button class="tx-del" data-id="${t.id}" title="Delete">✕</button>
        </div>`;
    }).join('');
  }

  app.innerHTML = html;
}

// Global Event Listeners using Delegation
document.addEventListener('click', (e) => {
  const target = e.target;

  if (target.id === 'exportBtn') {
    downloadBackup();
  } else if (target.id === 'importBtn') {
    const importFile = document.getElementById('importFile');
    if (importFile) importFile.click();
  } else if (target.id === 'addRecurringBtn') {
    addRecurring();
  } else if (target.classList.contains('recurring-del')) {
    removeRecurring(target.getAttribute('data-id'));
  } else if (target.classList.contains('tx-edit')) {
    editTransaction(target.getAttribute('data-id'));
  } else if (target.classList.contains('tx-del') && !target.classList.contains('recurring-del')) {
    const id = target.getAttribute('data-id');
    state.transactions = state.transactions.filter(t => t.id !== id);
    saveData();
    render();
  } else if (target.id === 'budgetEditBtn') {
    editingBudget = true;
    render();
  } else if (target.id === 'budgetSaveBtn') {
    const input = document.getElementById('budgetInput');
    const val = parseFloat(input.value);
    if (!isNaN(val) && val >= 0) {
      state.budget = val;
      editingBudget = false;
      saveData();
      render();
    }
  } else if (target.id === 'cycleEditBtn') {
    editingCycle = true;
    render();
  } else if (target.id === 'cycleSaveBtn') {
    const select = document.getElementById('cycleInput');
    state.cycleStartDay = parseInt(select.value, 10);
    editingCycle = false;
    saveData();
    render();
  }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'importFile' && e.target.files.length > 0) {
    importBackup(e.target.files[0]);
    e.target.value = '';
  }
});

document.addEventListener('submit', (e) => {
  if (e.target.id === 'addForm') {
    e.preventDefault();
    const form = e.target;
    const fd = new FormData(form);
    const amount = parseFloat(fd.get('amount'));
    if (isNaN(amount) || amount <= 0) return;
    
    const rawDate = fd.get('date') || new Date().toISOString().slice(0, 10);
    const [y, m, day] = rawDate.split('-').map(Number);
    const dateObj = new Date(y, m - 1, day, 12, 0, 0);

    state.transactions.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      amount: amount,
      category: fd.get('category'),
      note: fd.get('note') || '',
      date: dateObj.toISOString()
    });
    
    saveData();
    render();
  }
});

loadData();
</script>
</body>
</html>
